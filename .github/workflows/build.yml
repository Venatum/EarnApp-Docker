name: Build & Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 1 * * 1" # Monday at 1:00 UTC

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get EarnApp version
        id: version
        run: |
          VERSION=$(curl -sfL https://brightdata.com/static/earnapp/install.sh | grep -oP '^VERSION="\K[^"]+')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Per variant: build amd64, smoke test it, then (outside PRs) build every platform from the
  # same cache and push. EARNAPP_VERSION makes the build fail if BrightData serves another version.
  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: app
            dockerfile: app
            tags: |
              venatum/earnapp:latest
              venatum/earnapp:${{ needs.version.outputs.version }}
            platforms: linux/amd64,linux/arm/v7,linux/arm64
          - variant: lite
            dockerfile: lite
            tags: |
              venatum/earnapp:lite
              venatum/earnapp:lite-${{ needs.version.outputs.version }}
            platforms: linux/amd64,linux/arm/v7,linux/arm64
          - variant: debian
            dockerfile: app
            build-args: BASE_IMAGE=debian:trixie-slim
            tags: |
              venatum/earnapp:debian
              venatum/earnapp:debian-${{ needs.version.outputs.version }}
            platforms: linux/amd64,linux/arm/v7,linux/arm64
    env:
      BUILD_ARGS: |
        EARNAPP_VERSION=${{ needs.version.outputs.version }}
        ${{ matrix.build-args }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build for testing (amd64)
        uses: docker/build-push-action@v7
        with:
          context: build
          file: build/${{ matrix.dockerfile }}/Dockerfile
          build-args: ${{ env.BUILD_ARGS }}
          load: true
          tags: earnapp-test:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test
        run: tests/smoke.sh ${{ matrix.variant }} earnapp-test:${{ matrix.variant }}
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: venatum
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push all platforms
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: build
          file: build/${{ matrix.dockerfile }}/Dockerfile
          build-args: ${{ env.BUILD_ARGS }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

